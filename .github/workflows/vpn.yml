name: Ephemeral VPN + Remote Desktop

on:
  workflow_dispatch:
    inputs:
      duration_minutes:
        description: 'Duration to run (in minutes, max 350)'
        required: true
        default: '120'
      rdp_password:
        description: 'Set a password for the RDP user (runner)'
        required: true
        default: 'SuperSecret123!'

jobs:
  vpn-rdp:
    name: Start VPN & Remote Desktop
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Enable IPv4/IPv6 Routing & Firewall
        run: |
          set -e
          sudo sysctl -w net.ipv4.ip_forward=1
          sudo sysctl -w net.ipv6.conf.all.forwarding=1
          DEFAULT_IFACE=$(ip route show default | awk '{print $5}' | head -n1)
          sudo iptables -t nat -A POSTROUTING -o "$DEFAULT_IFACE" -j MASQUERADE
          sudo ip6tables -t nat -A POSTROUTING -o "$DEFAULT_IFACE" -j MASQUERADE

      - name: Install Desktop Environment (XFCE) & XRDP
        run: |
          set -e
          echo "[-] Updating packages and installing XFCE + XRDP..."
          sudo apt-get update -y
          # Install lightweight desktop and RDP server without interactive prompts
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            xfce4 \
            xfce4-goodies \
            xorgxrdp \
            xrdp \
            dbus-x11 \
            firefox

          echo "[-] Configuring XFCE session for XRDP..."
          echo "xfce4-session" > /home/runner/.xsession
          sudo chown runner:runner /home/runner/.xsession

          echo "[-] Setting RDP user password..."
          echo "runner:${{ github.event.inputs.rdp_password }}" | sudo chpasswd
          sudo adduser xrdp ssl-cert

          echo "[-] Starting XRDP Service..."
          sudo systemctl restart xrdp

      - name: Install & Start Tailscale
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          set -e
          curl -fsSL https://tailscale.com/install.sh | sh
          sudo tailscale up \
            --authkey="${TAILSCALE_AUTH_KEY}" \
            --advertise-exit-node \
            --ssh \
            --hostname=gh-vpn-runner \
            --accept-routes

      - name: Print Connection Details
        run: |
          TS_IP=$(tailscale ip -4)
          echo "================================================="
          echo " RDP + VPN GATEWAY IS ONLINE!"
          echo "================================================="
          echo "Tailscale IP: $TS_IP"
          echo "RDP Username: runner"
          echo "RDP Password: ${{ github.event.inputs.rdp_password }}"
          echo "================================================="

      - name: Keep-Alive Loop
        run: |
          cleanup() {
            echo "[-] Signal received. Logging out..."
            sudo tailscale logout || true
            exit 0
          }
          trap cleanup SIGINT SIGTERM

          DURATION_MINUTES=${{ github.event.inputs.duration_minutes }}
          TOTAL_SECONDS=$((DURATION_MINUTES * 60))
          ELAPSED=0
          INTERVAL=30

          while [ $ELAPSED -lt $TOTAL_SECONDS ]; do
            REMAINING=$(( (TOTAL_SECONDS - ELAPSED) / 60 ))
            echo "[Heartbeat $(date +'%T')] Alive | Remaining: ~${REMAINING} min"
            sleep $INTERVAL
            ELAPSED=$((ELAPSED + INTERVAL))
          done

          sudo tailscale logout