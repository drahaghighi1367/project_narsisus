name: Ephemeral Runner (VPN / Remote Desktop)

on:
  workflow_dispatch:
    inputs:
      enable_vpn:
        description: 'Enable VPN (Tailscale Exit Node)'
        type: boolean
        required: true
        default: true
      require_europe:
        description: 'Ensure low-latency Europe Runner (Fail fast if US)'
        type: boolean
        required: true
        default: false
      enable_rdp:
        description: 'Enable GUI Remote Desktop (XFCE + XRDP)'
        type: boolean
        required: true
        default: false
      duration_minutes:
        description: 'Duration to run in minutes (max 350 to allow clean shutdown)'
        required: true
        default: '350'

# Prevents multiple runners from executing simultaneously
concurrency:
  group: ephemeral-runner-lock
  cancel-in-progress: true

jobs:
  ephemeral-runner:
    name: Start Runner Gateway
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Check Runner Region (Low-Latency Filter)
        if: ${{ github.event.inputs.require_europe == 'true' || github.event.inputs.require_europe == true }}
        run: |
          COUNTRY=$(curl -s https://ipinfo.io/country)
          CITY=$(curl -s https://ipinfo.io/city)
          echo "Runner is located in: $CITY, $COUNTRY"

          # If the runner spawned in North America, cancel immediately so you can re-run
          if [[ "$COUNTRY" =~ ^(US|CA)$ ]]; then
            echo "::error::Runner spawned in US/Canada ($CITY, $COUNTRY). Exiting so you can re-trigger for an EU runner (London/Amsterdam) to avoid the slow 316ms Chicago relay."
            exit 1
          fi
          echo "[✓] Runner is in Europe ($CITY, $COUNTRY). Low latency confirmed!"

      - name: Enable IPv4/IPv6 Routing, MSS Clamping & BBR (VPN Mode)
        if: ${{ github.event.inputs.enable_vpn == 'true' || github.event.inputs.enable_vpn == true }}
        run: |
          set -e
          echo "[-] Configuring IP Forwarding, BBR, and TCP Clamping..."
          
          # Enable IP Forwarding
          sudo sysctl -w net.ipv4.ip_forward=1
          sudo sysctl -w net.ipv6.conf.all.forwarding=1
          
          # Enable BBR TCP Congestion Control (drastically improves throughput over lossy relays)
          sudo sysctl -w net.core.default_qdisc=fq
          sudo sysctl -w net.ipv4.tcp_congestion_control=bbr

          # Increase UDP buffer sizes for WireGuard
          sudo sysctl -w net.core.rmem_max=2500000
          sudo sysctl -w net.core.wmem_max=2500000

          DEFAULT_IFACE=$(ip route show default | awk '{print $5}' | head -n1)
          
          # 1. NAT Masquerade
          sudo iptables -t nat -A POSTROUTING -o "$DEFAULT_IFACE" -j MASQUERADE
          sudo ip6tables -t nat -A POSTROUTING -o "$DEFAULT_IFACE" -j MASQUERADE

          # 2. Allow Forwarding between Tailscale and the Internet
          sudo iptables -A FORWARD -i tailscale0 -j ACCEPT
          sudo iptables -A FORWARD -o tailscale0 -m conntrack --ctstate RELATED,ESTABLISHED -j ACCEPT
          sudo ip6tables -A FORWARD -i tailscale0 -j ACCEPT
          sudo ip6tables -A FORWARD -o tailscale0 -m conntrack --ctstate RELATED,ESTABLISHED -j ACCEPT

          # 3. CRITICAL: TCP MSS Clamping (Prevents packet fragmentation drops / ETIMEDOUT)
          sudo iptables -t mangle -A FORWARD -p tcp --tcp-flags SYN,RST SYN -j TCPMSS --clamp-mss-to-pmtu
          sudo ip6tables -t mangle -A FORWARD -p tcp --tcp-flags SYN,RST SYN -j TCPMSS --clamp-mss-to-pmtu

          # 4. Offload optimizations
          sudo ethtool -K "$DEFAULT_IFACE" rx-udp-gro-forwarding on rx-gro-list off || true

      - name: Install Desktop Environment & Optimize XRDP (RDP Mode)
        if: ${{ github.event.inputs.enable_rdp == 'true' || github.event.inputs.enable_rdp == true }}
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          set -e
          PASS="${RDP_PASSWORD:-$(openssl rand -base64 12)}"

          echo "[-] Installing lightweight XFCE desktop & XRDP..."
          sudo apt-get update -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            xfce4 \
            xfce4-goodies \
            xorgxrdp \
            xrdp \
            dbus-x11 \
            firefox

          echo "[-] Setting up XFCE session..."
          echo "xfce4-session" > /home/runner/.xsession
          sudo chown runner:runner /home/runner/.xsession

          echo "[-] Applying Low-Latency Performance Tweaks to XRDP..."
          sudo sed -i 's/max_bpp=32/max_bpp=16/g' /etc/xrdp/xrdp.ini
          sudo sed -i 's/crypt_level=high/crypt_level=low/g' /etc/xrdp/xrdp.ini

          echo "[-] Setting RDP password securely..."
          echo "runner:$PASS" | sudo chpasswd
          sudo adduser xrdp ssl-cert

          echo "[-] Starting XRDP Service..."
          sudo systemctl restart xrdp

      - name: Install & Connect Tailscale
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
          ENABLE_VPN: ${{ github.event.inputs.enable_vpn }}
        run: |
          set -e
          echo "[-] Installing Tailscale..."
          curl -fsSL https://tailscale.com/install.sh | sh

          TS_FLAGS="--authkey=${TAILSCALE_AUTH_KEY} --ssh --hostname=gh-vpn-runner --accept-routes"
          
          if [ "$ENABLE_VPN" = "true" ]; then
            echo "[-] Enabling Exit Node advertising..."
            TS_FLAGS="$TS_FLAGS --advertise-exit-node"
          fi

          echo "[-] Bringing Tailscale up..."
          sudo tailscale up $TS_FLAGS

      - name: Print Connection Details
        run: |
          TS_IP=$(tailscale ip -4)
          echo "================================================="
          echo " RUNNER IS ONLINE AND READY"
          echo "================================================="
          echo "Tailscale IP:      $TS_IP"
          echo "SSH Access:        tailscale ssh runner@gh-vpn-runner"
          echo "VPN Exit Node:     ${{ github.event.inputs.enable_vpn }}"
          echo "RDP GUI Enabled:   ${{ github.event.inputs.enable_rdp }}"
          if [ "${{ github.event.inputs.enable_rdp }}" = "true" ]; then
            echo "RDP Host:          gh-vpn-runner (or $TS_IP)"
            echo "RDP User:          runner"
            echo "RDP Password:      [READ FROM REPO SECRETS: RDP_PASSWORD]"
          fi
          echo "================================================="

      - name: Keep-Alive Loop with Heartbeat
        run: |
          DURATION_MINUTES=${{ github.event.inputs.duration_minutes }}
          TOTAL_SECONDS=$((DURATION_MINUTES * 60))
          ELAPSED=0
          INTERVAL=30

          while [ $ELAPSED -lt $TOTAL_SECONDS ]; do
            REMAINING=$(( (TOTAL_SECONDS - ELAPSED) / 60 ))
            ACTIVE_CONNS=$(sudo netstat -natp 2>/dev/null | grep ESTABLISHED | wc -l)
            echo "[Heartbeat $(date +'%T')] Alive | Remaining: ~${REMAINING} min | Active Connections: ${ACTIVE_CONNS}"
            sleep $INTERVAL
            ELAPSED=$((ELAPSED + INTERVAL))
          done

      - name: Clean Tailscale Teardown
        if: always()
        run: |
          echo "[-] Disconnecting from Tailscale network cleanly..."
          sudo tailscale logout || true
